# Author: QRT Solutions
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qrt-seminario-lab"
version = "1.0.0rc1"
description = "Quantitative strategy design seminar and verifiable research contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "QRT Solutions"}]
dependencies = ["jsonschema[format]>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2",
       "types-jsonschema", "mkdocs>=1.6,<2", "pip-audit>=2.9,<3"]

[project.scripts]
seminario = "seminario_lab.cli:main"

[project.urls]
Repository = "https://github.com/QRT-Solutions/seminario_2-public"

[tool.hatch.build.targets.wheel]
packages = ["src/seminario_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/seminario_lab"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.seminario]
project = "qrt-seminario-lab"

