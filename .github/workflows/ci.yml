name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.11
      - run: uv sync --locked --group dev
      - run: uv pip check
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Registry and deployment
        run: |
          uv run python3 quant_agentic_swarm/tools/validate_registry.py
          uv run python3 quant_agentic_swarm/tools/deploy_strategies.py --check
      - name: Pine v6 only
        run: test "$(grep -rl '@version=5' --include='*.pine' quant_agentic_swarm TradingView | wc -l)" -eq 0
      - name: Private paths, literal authorization and history
        run: uv run python -m seminario_lab.publication
      - name: Export is derived from lock
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - run: uv run python tools/check_links.py
      - run: uv run mkdocs build --strict
      - run: uv build
  secrets:
    name: General secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python tools/install_gitleaks.py
      - run: .local/tools/gitleaks git --redact --no-banner --log-opts=--all .
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.11
      - run: uv sync --locked --group dev
      - run: uv run pip-audit --disable-pip --no-deps -r requirements.txt
