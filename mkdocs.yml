site_name: QRT Quantitative Seminar
site_description: Diseño y validación de estrategias con experimentos reproducibles
site_author: QRT Solutions
site_url: https://felipemillar.github.io/seminario_2/
repo_url: https://github.com/felipemillar/seminario_2
edit_uri: ''
docs_dir: docs
site_dir: site
use_directory_urls: false
hooks:
  - tools/docs_hook.py
theme:
  name: mkdocs
  locale: es
  color_mode: auto
  user_color_mode_toggle: true
nav:
  - Inicio: index.md
  - Empieza aquí: docs/start.md
  - Guía rápida: docs/quickstart.md
  - English: README.en.md
  - Metodología: docs/methodology.md
  - Validación: docs/validation.md
  - Estrategias: docs/strategies.md
  - Arquitectura: docs/architecture.md
  - Agentes: docs/agents.md
  - Glosario: docs/glossary.md
  - Publicación: docs/release.md
markdown_extensions:
  - tables
  - fenced_code
validation:
  nav:
    omitted_files: ignore
