site_name: QRT Quantitative Seminar
site_description: Diseño y validación de estrategias con experimentos reproducibles
site_author: QRT Solutions
site_url: https://qrt-solutions.github.io/seminario_2-public/
repo_url: https://github.com/QRT-Solutions/seminario_2-public
edit_uri: ''
docs_dir: docs
site_dir: site
use_directory_urls: false
hooks:
  - tools/docs_hook.py
theme:
  name: mkdocs
  highlightjs: false
  locale: es
  color_mode: auto
  user_color_mode_toggle: true
nav:
  - Inicio: index.md
  - Empieza aquí: docs/start.md
  - Guía rápida: docs/quickstart.md
  - English: README.en.md
  - Metodología: docs/methodology.md
  - Validación: docs/validation.md
  - Estrategias: docs/strategies.md
  - Arquitectura: docs/architecture.md
  - Agentes: docs/agents.md
  - Glosario: docs/glossary.md
  - Publicación: docs/release.md
  - Formación Cuantitativa:
      - 100 Preguntas Esenciales: MT5/GUIA_100_PREGUNTAS_TRADING_CUANTITATIVO.md
      - Pilar 1 (Entorno y Datos): MT5/docs_educativos/PILAR_1_ENTORNO_Y_DATOS.md
      - Pilar 2 (Hipótesis y Lógica): MT5/docs_educativos/PILAR_2_HIPOTESIS_Y_LOGICA.md
      - Pilar 3 (Código y Paridad): MT5/docs_educativos/PILAR_3_CODIGO_Y_PARIDAD.md
      - Pilar 4 (Backtesting y Auditoría): MT5/docs_educativos/PILAR_4_BACKTESTING_Y_AUDITORIA.md
      - Auditoría de Backtesting (3 Módulos): MT5/BACKTEST_AUDIT_MANUAL.md
      - Inyección de Datos M1: MT5/DATA_INJECTION_GUIDE.md
      - Instrucciones Creador de Bots IA: INSTRUCCIONES_SISTEMA_CREADOR_BOTS_IA.md
markdown_extensions:
  - tables
  - fenced_code
validation:
  nav:
    omitted_files: ignore
